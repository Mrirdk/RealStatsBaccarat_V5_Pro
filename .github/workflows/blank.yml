name: Build AutoRobot V5 Pro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Khong tim thay thu muc du an Android!"
            ls -la
            exit 1
          fi
          echo "Dang build du an tai: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apk_out/AutoRobot-Baccarat-V5-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRobot-Baccarat-V5-Pro-APK
          path: apk_out/AutoRobot-Baccarat-V5-Pro.apk
          if-no-files-found: error
